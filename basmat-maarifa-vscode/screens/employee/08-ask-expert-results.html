<script data-purpose="chatbot-interactions">
  const chatMessagesContainer = document.getElementById('chatMessagesContainer');
  const dynamicChatSlot = document.getElementById('dynamicChatSlot');
  const typingIndicator = document.getElementById('typingIndicator');
  const chatForm = document.getElementById('chatForm');
  const chatInput = document.getElementById('chatInput');

  function scrollChatToBottom() {
    setTimeout(() => {
      chatMessagesContainer.scrollTo({
        top: chatMessagesContainer.scrollHeight,
        behavior: 'smooth'
      });
    }, 50);
  }

  function handleQuickSelect(text) {
    chatInput.value = text;
    processMessage(text);
  }

  chatForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = chatInput.value.trim();
    if (!text) return;
    processMessage(text);
  });

  function processMessage(userText) {
    chatInput.value = '';

    // 1. Append User Message Bubble (Light Green Background, aligned right in RTL)
    const userBubble = document.createElement('div');
    userBubble.className = 'flex justify-end';
    userBubble.innerHTML = `
      <div class="bg-[#e8f5e9] border border-emerald-200/90 text-brand-dark font-medium rounded-2xl rounded-tl-xs px-4 py-2.5 max-w-[80%] text-sm sm:text-base leading-relaxed shadow-xs">
        ${escapeHtml(userText)}
      </div>
    `;
    dynamicChatSlot.appendChild(userBubble);
    scrollChatToBottom();

    // 2. Show Typing Indicator
    typingIndicator.classList.remove('hidden');
    scrollChatToBottom();

    // 3. Evaluate matching logic after short realistic delay
    setTimeout(() => {
      typingIndicator.classList.add('hidden');

      const isMatch = userText.includes('كلمة المرور') || 
                      userText.includes('تعذّر') || 
                      userText.includes('تعذر') || 
                      userText.includes('حساب');

      if (isMatch) {
        renderMatchedKnowledgeResponse();
      } else {
        renderUnmatchedResponse();
      }
      scrollChatToBottom();
    }, 750);
  }

  // State 1: Matched Knowledge
  function renderMatchedKnowledgeResponse() {
    const msgDiv = document.createElement('div');
    msgDiv.className = 'flex items-start gap-3 max-w-[92%] sm:max-w-[85%]';
    msgDiv.innerHTML = `
      <div class="w-9 h-9 rounded-full bg-brand-dark text-brand-gold flex items-center justify-center shrink-0 shadow-sm mt-0.5">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
          <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2M7.5 13A2.5 2.5 0 0 0 5 15.5 2.5 2.5 0 0 0 7.5 18a2.5 2.5 0 0 0 2.5-2.5A2.5 2.5 0 0 0 7.5 13m9 0a2.5 2.5 0 0 0-2.5 2.5 2.5 2.5 0 0 0 2.5 2.5 2.5 2.5 0 0 0 2.5-2.5 2.5 2.5 0 0 0-2.5-2.5z"/>
        </svg>
      </div>
      <div class="bg-[#f8fafc] border border-gray-200/90 rounded-2xl rounded-tr-xs p-4 sm:p-5 text-gray-800 shadow-xs space-y-3.5 w-full">
        <div>
          <span class="inline-block px-2.5 py-0.5 rounded-md text-xs font-bold bg-emerald-100/70 text-brand-dark border border-emerald-300/60 mb-2">
            معرفة مطابقة معتمدة
          </span>
          <h4 class="font-bold text-gray-900 text-sm sm:text-base leading-snug">
            وجدت معرفة مطابقة لمشكلتك بعنوان: «تعذّر دخول الموظف لحسابه بعد إعادة تعيين كلمة المرور»
          </h4>
        </div>

        <!-- Summary Card -->
        <div class="bg-white border border-gray-200 rounded-xl p-3.5 shadow-2xs">
          <p class="text-xs sm:text-sm text-gray-700 leading-relaxed font-medium">
            <span class="font-bold text-brand-dark">ملخص الحل: </span>
            تأكد من مسح كلمة المرور القديمة المحفوظة في المتصفح، ثم سجّل الخروج من جميع الأجهزة وحاول الدخول باستخدام كلمة المرور الجديدة.
          </p>
        </div>

        <!-- Source Badge Link -->
        <div class="flex items-center gap-1.5 text-xs text-gray-600 bg-amber-50/70 border border-amber-200/70 px-3 py-1.5 rounded-lg">
          <svg class="w-4 h-4 text-brand-gold shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span class="font-semibold text-gray-800">المصدر:</span>
          <span>لائحة الأمن السيبراني وضوابط الهوية الرقمية – المادة 14</span>
        </div>

        <!-- Detailed Steps Container (Toggled) -->
        <div id="stepsSection" class="hidden bg-white border border-brand-dark/20 rounded-xl p-3.5 space-y-2 mt-2">
          <h5 class="text-xs font-bold text-brand-dark">خطوات الحل التفصيلية (٥ خطوات):</h5>
          <ol class="text-xs sm:text-sm text-gray-700 space-y-1.5 pr-4 list-decimal list-outside">
            <li>مسح ملفات تعريف الارتباط وكلمات المرور المخزنة في المتصفح.</li>
            <li>إعادة تعيين كلمة المرور من خلال البوابة الموحدة والتأكد من مطابقة شروط التعقيد.</li>
            <li>الانتظار لمدة دقيقتين لمزامنة كلمة المرور مع خوادم الدليل النشط (Active Directory).</li>
            <li>تسجيل الخروج من الجلسات المفتوحة على تطبيقات الجوال والبريد.</li>
            <li>تسجيل الدخول مجددًا باستخدام اسم المستخدم وكلمة المرور الجديدة.</li>
          </ol>
        </div>

        <!-- Regulation Notice Container (Toggled) -->
        <div id="regulationNotice" class="hidden bg-emerald-50/80 border border-brand-dark/20 text-brand-dark p-3 rounded-xl text-xs space-y-1">
          <p class="font-bold">نص المادة 14 من لائحة الأمن السيبراني:</p>
          <p class="text-gray-700">«يجب على الموظف عدم استخدام كلمات مرور مكررة، ويتم إلغاء الجلسات السابقة فور توليد كلمة سر جديدة لضمان سلامة الهوية الرقمية ومنع الاختراقات».</p>
        </div>

        <!-- Expert Immediate Contact In Chat (Toggled) -->
        <div id="expertImmediateContact" class="hidden bg-white border border-brand-gold/50 p-3.5 rounded-xl shadow-xs">
          <div class="flex items-center justify-between gap-3 flex-wrap">
            <div>
              <p class="text-xs font-bold text-gray-900">الخبير المختص: <span class="text-brand-dark">أحمد المطيري</span></p>
              <p class="text-xs text-gray-600 mt-0.5">الإدارة: إدارة تقنية المعلومات | التحويلة: <span class="font-bold text-brand-dark">٢٣٤٥</span></p>
            </div>
            <button type="button" onclick="startExpertChat()" class="bg-brand-dark hover:bg-brand-dark-hover text-brand-gold font-bold px-3 py-1.5 rounded-lg text-xs transition-colors">
              بدء الاستشارة الفورية
            </button>
          </div>
        </div>

        <!-- Action Option Buttons -->
        <div class="flex flex-wrap items-center gap-2 pt-1 border-t border-gray-200">
          <button type="button" onclick="toggleElement('stepsSection')" class="bg-white hover:bg-emerald-50 text-brand-dark border border-gray-300 hover:border-brand-dark/40 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">
            عرض خطوات الحل كاملة
          </button>
          <button type="button" onclick="toggleElement('regulationNotice')" class="bg-white hover:bg-amber-50 text-gray-800 border border-gray-300 hover:border-amber-300 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">
            عرض اللائحة المرتبطة
          </button>
          <button type="button" onclick="toggleElement('expertImmediateContact')" class="bg-white hover:bg-gray-100 text-gray-800 border border-gray-300 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">
            تواصل مع الخبير
          </button>
          <button type="button" onclick="resetChat()" class="bg-white hover:bg-gray-100 text-gray-500 border border-gray-300 px-3 py-1.5 rounded-lg text-xs font-medium transition-all">
            البحث عن مشكلة أخرى
          </button>
        </div>

        <!-- 5-Star Interactive Rating -->
        <div class="pt-2 border-t border-gray-100 flex flex-col sm:flex-row sm:items-center justify-between gap-2" id="starRatingWrapper">
          <span class="text-xs font-semibold text-gray-600">قيّم مدى فائدة الإجابة:</span>
          <div class="flex items-center gap-1">
            <div class="flex items-center gap-1 cursor-pointer" id="starsContainer">
              ${[1, 2, 3, 4, 5].map(starNum => `
                <button type="button" onclick="rateKnowledge(${starNum})" data-star="${starNum}" class="text-gray-300 hover:text-brand-gold transition-colors p-0.5 focus:outline-none">
                  <svg class="w-5 h-5 fill-current" viewBox="0 0 20 20">
                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                  </svg>
                </button>
              `).join('')}
            </div>
            <span id="ratingFeedbackText" class="text-xs font-bold text-emerald-700 mr-2 hidden">شكرًا لتقييمك!</span>
          </div>
        </div>

      </div>
    `;
    dynamicChatSlot.appendChild(msgDiv);
  }

  // State 2: Unmatched Knowledge -> Expert Details Card
  function renderUnmatchedResponse() {
    const msgDiv = document.createElement('div');
    msgDiv.className = 'flex items-start gap-3 max-w-[92%] sm:max-w-[85%]';
    msgDiv.innerHTML = `
      <div class="w-9 h-9 rounded-full bg-brand-dark text-brand-gold flex items-center justify-center shrink-0 shadow-sm mt-0.5">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
          <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2M7.5 13A2.5 2.5 0 0 0 5 15.5 2.5 2.5 0 0 0 7.5 18a2.5 2.5 0 0 0 2.5-2.5A2.5 2.5 0 0 0 7.5 13m9 0a2.5 2.5 0 0 0-2.5 2.5 2.5 2.5 0 0 0 2.5 2.5 2.5 2.5 0 0 0 2.5-2.5 2.5 2.5 0 0 0-2.5-2.5z"/>
        </svg>
      </div>
      <div class="bg-[#f8fafc] border border-gray-200/90 rounded-2xl rounded-tr-xs p-4 sm:p-5 text-gray-800 shadow-xs space-y-4 w-full">
        <div>
          <span class="inline-block px-2.5 py-0.5 rounded-md text-xs font-bold bg-amber-100/70 text-amber-800 border border-amber-300/60 mb-2">
            لم يُعثر على تطابق مباشر
          </span>
          <p class="font-bold text-gray-900 text-sm sm:text-base leading-snug">
            لم أجد معرفة مطابقة لسؤالك حاليًا، لكن يمكنك التواصل مع الخبير المختص.
          </p>
        </div>

        <!-- Expert Profile Card -->
        <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm">
          <div class="flex items-center gap-3.5 mb-3">
            <div class="w-12 h-12 rounded-full bg-brand-dark text-brand-gold flex items-center justify-center shrink-0 shadow-inner">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </div>
            <div>
              <h5 class="font-bold text-gray-900 text-sm sm:text-base">الخبير المختص: أحمد المطيري</h5>
              <p class="text-xs text-gray-500 mt-0.5">الإدارة: إدارة تقنية المعلومات</p>
            </div>
          </div>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs bg-gray-50 p-2.5 rounded-lg border border-gray-100">
            <div>
              <span class="text-gray-500">التخصص: </span>
              <span class="font-semibold text-gray-800">الدعم الفني والأنظمة</span>
            </div>
            <div>
              <span class="text-gray-500">التحويلة: </span>
              <span class="font-bold text-brand-dark">٢٣٤٥</span>
            </div>
          </div>

          <div class="flex items-center gap-2.5 mt-4">
            <button type="button" onclick="startExpertChat()" class="bg-brand-dark hover:bg-brand-dark-hover text-brand-gold font-bold px-4 py-2 rounded-xl text-xs sm:text-sm transition-colors flex items-center gap-1.5 shadow-sm">
              <svg class="w-4 h-4 text-brand-gold" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
              تواصل مع الخبير
            </button>
            <button type="button" onclick="resetChat()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-4 py-2 rounded-xl text-xs sm:text-sm transition-colors">
              طرح سؤال آخر
            </button>
          </div>
        </div>

      </div>
    `;
    dynamicChatSlot.appendChild(msgDiv);
  }

  // Toggle helpers
  function toggleElement(elementId) {
    const el = document.getElementById(elementId);
    if (!el) return;
    el.classList.toggle('hidden');
    scrollChatToBottom();
  }

  // Star Rating Interactivity
  function rateKnowledge(score) {
    const stars = document.querySelectorAll('#starsContainer [data-star]');
    stars.forEach(btn => {
      const val = parseInt(btn.getAttribute('data-star'));
      if (val <= score) {
        btn.classList.remove('text-gray-300');
        btn.classList.add('text-brand-gold');
      } else {
        btn.classList.add('text-gray-300');
        btn.classList.remove('text-brand-gold');
      }
    });
    const feedback = document.getElementById('ratingFeedbackText');
    if (feedback) feedback.classList.remove('hidden');
  }

  // Simulated direct expert modal / alert notification
  function startExpertChat() {
    const notice = document.createElement('div');
    notice.className = 'flex items-start gap-3 max-w-[85%]';
    notice.innerHTML = `
      <div class="w-9 h-9 rounded-full bg-brand-gold text-brand-dark flex items-center justify-center shrink-0 shadow-sm mt-0.5">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 20 20">
          <path d="M2 5a2 2 0 012-2h7a2 2 0 012 2v4a2 2 0 01-2 2H9l-3 3v-3H4a2 2 0 01-2-2V5z"/>
          <path d="M15 7v2a4 4 0 01-4 4H9.828l-1.766 1.767c.28.149.599.233.938.233h2l3 3v-3h2a2 2 0 002-2V9a2 2 0 00-2-2h-1z"/>
        </svg>
      </div>
      <div class="bg-emerald-50 border border-emerald-200 text-brand-dark rounded-2xl rounded-tr-xs p-3.5 text-xs sm:text-sm font-medium shadow-xs">
        تم إرسال إشعار فوري إلى الخبير <span class="font-bold">أحمد المطيري</span> (تحويلة: ٢٣٤٥). سيتواصل معك عبر الدردشة الداخلية للنظام قريبًا.
      </div>
    `;
    dynamicChatSlot.appendChild(notice);
    scrollChatToBottom();
  }

  // Reset conversation to initial state
  function resetChat() {
    dynamicChatSlot.innerHTML = '';
    chatInput.value = '';
    chatInput.focus();
    scrollChatToBottom();
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
</script>
<!-- END: Interactive ChatBot Logic Script -->
</body></html>
